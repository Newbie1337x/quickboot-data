spring.application.name=spring-crud-template

# ==========================================
# ACTIVE PROFILE
# Change to 'prod' before deploying to production.
# Each profile overrides database visibility, SQL logging and H2 console settings.
# ==========================================
spring.profiles.active=dev

# ==========================================
# DATABASE CONFIGURATION (Environment Variables with Defaults)
# ==========================================
# Default: H2 Local File — override via env vars for PostgreSQL or any other driver.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/default_db}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# ==========================================
# JPA / Hibernate Common Configuration
# ==========================================
# Profile-specific values (show-sql, ddl-auto) are in application-dev/prod.properties
spring.jpa.open-in-view=false

# ==========================================
# JACKSON (JSON Formatting)
# ==========================================
# LocalDateTime is serialized as ISO 8601 (e.g. 2026-05-07T19:50:55).
# No per-field @JsonFormat needed — this single property handles all dates globally.
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ==========================================
# ACTUATOR (Health checks & metrics)
# ==========================================
# Expose only safe endpoints by default; restrict in prod via application-prod.properties
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# ==========================================
# CORS
# ==========================================
# Restrict to specific origins in prod. Wildcard (*) is fine for dev only.
# Override per profile via cors.allowed-origin-patterns property.
cors.allowed-origin-patterns=*

# ==========================================
# POSTGRESQL CONFIGURATION (Uncomment to switch)
# ==========================================
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app_db}
