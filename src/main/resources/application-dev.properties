# ==========================================
# DEV PROFILE - Overrides for local development
# ==========================================

# H2 Console (Access at /h2-console) — NEVER enable in production
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Verbose SQL — useful for debugging, disable in prod
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DDL auto: update is convenient for dev, use validate/none in prod
spring.jpa.hibernate.ddl-auto=update

# Actuator: expose all endpoints locally for observability
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# CORS: allow all local frontend ports during development
cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
