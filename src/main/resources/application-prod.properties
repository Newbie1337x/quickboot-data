# ==========================================
# PROD PROFILE - Safe production defaults
# ==========================================

# H2 console must be disabled in production
spring.h2.console.enabled=false

# Never log SQL in production (performance + security)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Validate schema on startup — safer than update in production
spring.jpa.hibernate.ddl-auto=validate

# Actuator: expose only health in production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS: restrict to your production domain
# cors.allowed-origin-patterns=https://yourdomain.com
